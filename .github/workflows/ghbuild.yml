# This workflow reuses the World Health Organization GitHub action for building IGs
# Initial idea by Carl Leitner
# Change log:
# v0.1.0
# 2021-06-18: publish default branches to / , other branches branches/<branch>
# 2021-11-26: reusable workflow

name: FHIR_IG_BUILD_AND_PUBLISH
  
# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events for any main branch
  push:
    branches-ignore:    
      - 'gh-pages'
  pull_request:

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  pull-requests: write

jobs:
  # This workflow contains a single job called "build"
  call_build: 
    uses: WorldHealthOrganization/smart-base/.github/workflows/ghbuild.yml@v1

  publish_public:
    name: Publish generated IG to eehrxf.github.io
    needs: call_build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: public-pages-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout generated IG
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: generated-ig

      - name: Checkout public Pages repository
        uses: actions/checkout@v6
        with:
          repository: EEHRxF/eehrxf.github.io
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: public-site

      - name: Copy generated IG
        run: |
          mkdir -p public-site/logical-model
          rsync -a --delete \
            --exclude '.git' \
            generated-ig/ \
            public-site/logical-model/
          touch public-site/.nojekyll

      - name: Commit and publish
        working-directory: public-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logical-model .nojekyll

          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "Publish logical-model from ${GITHUB_SHA}"
            git push origin HEAD:main
          fi

  build_word_document:
    name: Generate logical model Word document
    needs: call_build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout generated IG
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: generated-ig

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install python-docx

      - name: Generate Word document
        run: |
          published_ref="${GITHUB_REF##*/}"
          branch_output="generated-ig/branches/${published_ref}"

          if find "${branch_output}" -maxdepth 1 -type f \
            -name 'StructureDefinition-*.json' -print -quit 2>/dev/null | grep -q .; then
            input_path="${branch_output}"
          else
            input_path="generated-ig"
          fi

          python scripts/generate_logical_model_docx.py \
            --input-path "${input_path}" \
            --output out/logical-models.docx

      - name: Upload Word Document
        uses: actions/upload-artifact@v7
        with:
          name: logical-models.docx
          path: out/logical-models.docx
          archive: false

          
