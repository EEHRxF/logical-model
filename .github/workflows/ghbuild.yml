# This workflow reuses the World Health Organization GitHub action for building IGs
# Initial idea by Carl Leitner
# Change log:
# v0.1.0
# 2021-06-18: publish default branches to / , other branches branches/<branch>
# 2021-11-26: reusable workflow

name: FHIR_IG_BUILD_AND_PUBLISH
  
# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events for any main branch
  push:
    branches-ignore:    
      - 'gh-pages'
  pull_request:

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  pull-requests: write

jobs:
  # This workflow contains a single job called "build"
  call_build: 
    uses: WorldHealthOrganization/smart-base/.github/workflows/ghbuild.yml@v1

  publish_public:
    name: Publish generated IG to eehrxf.github.io
    needs: call_build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: public-pages-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout generated IG
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: generated-ig

      - name: Checkout public Pages repository
        uses: actions/checkout@v6
        with:
          repository: EEHRxF/eehrxf.github.io
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: public-site

      - name: Copy generated IG
        run: |
          mkdir -p public-site/logical-model
          rsync -a --delete \
            --exclude '.git' \
            generated-ig/ \
            public-site/logical-model/
          touch public-site/.nojekyll

      - name: Commit and publish
        working-directory: public-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logical-model .nojekyll

          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "Publish logical-model from ${GITHUB_SHA}"
            git push origin HEAD:main
          fi

  build_tables:
    needs: call_build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: 'gh-pages'

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Checkout table tool
        uses: actions/checkout@v6
        with:
          repository: danka74/easy-tree
          path: easy-tree
          
      - name: Checkout table tool
        uses: actions/checkout@v6
        with:
          repository: danka74/fhir-generate
          path: fhir-generate
          
      - name: Cache external tool
        uses: actions/cache@v4
        with:
          path: fhir-generate/target
          key: ${{ runner.os }}-fhir-generate-${{ hashFiles('fhir-generate/Cargo.lock') }}

      - name: Build tables
        run:  |
          echo "$(basename ${{ github.ref }})"
          cd fhir-generate
          cargo build --release
          ./target/release/fhir-generate table ../branches/$(basename ${{ github.ref }})/StructureDefinition*.json
          pandoc *.md -o tables.docx --reference-doc=custom-reference.docx 
          
      - name: Upload Word Document
        uses: actions/upload-artifact@v7
        with:
          name: tables-word-doc
          path: fhir-generate/tables.docx
          archive: false

          
